name: Copy bot

# Runs the copier around the clock on GitHub's free runners (free and unlimited
# for public repos). Each run lasts ~5h40m. Every run queues the next one as soon
# as it starts, so the next run takes over the moment this one ends. GitHub's
# cron is best-effort and often skipped for an hour or more, so it is only a
# backup. Only one run is ever active at a time.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      run_minutes:
        description: How long this run lasts (default 340)
        default: "340"

concurrency:
  group: copy-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Queue the next run
        continue-on-error: true
        run: gh workflow run bot.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m bot.main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MINUTES: ${{ inputs.run_minutes || '340' }}
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
