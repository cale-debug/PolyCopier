name: Check trader
on:
  workflow_dispatch:
    inputs:
      wallet:
        description: 0x wallet to size up
        required: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/check_trader.py "${{ inputs.wallet }}" | tee -a "$GITHUB_STEP_SUMMARY"
